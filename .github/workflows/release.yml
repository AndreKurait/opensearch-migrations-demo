# Cross-platform release: on a v* tag, build ma-demo for linux + macOS
# (x86_64 + aarch64), tar each, and upload them + install.sh to the GitHub
# release. The toolchain is pinned by rust-toolchain.toml.
name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/verify_release.py"
      - "tests/test_release.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "src/**"
      - "install.sh"
      - "docs/releases/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build + attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve requested release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      stripped: ${{ steps.ver.outputs.stripped }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - name: Resolve version and commit
        id: ver
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            RELEASE_TAG="v$package_version"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::invalid release tag"; exit 1; }
          version="${RELEASE_TAG#v}"
          [[ "$version" == "$package_version" ]] || { echo "::error::tag/package version mismatch"; exit 1; }
          test -s "docs/releases/${version}.md"
          {
            echo "tag=$RELEASE_TAG"
            echo "stripped=$version"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            linker: gcc-aarch64-linux-gnu
            cross: true
          # Cross-compile Intel binaries on the supported Apple Silicon image;
          # the macOS SDK includes both architectures.
          - target: x86_64-apple-darwin
            os: macos-15
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-linker (linux aarch64)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        shell: bash
        env:
          DEMO_VERSION: ${{ needs.resolve.outputs.stripped }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify stamped version
        # The build must embed the tag's version (DEMO_VERSION). Catch an empty
        # or mismatched stamp before publishing. Skip cross-built targets (can't
        # exec them on this runner's arch); the native ones run here.
        if: ${{ ! matrix.cross }}
        shell: bash
        run: |
          want="${{ needs.resolve.outputs.stripped }}"
          [ -n "$want" ] || { echo "::error::empty version"; exit 1; }
          got="$(target/${{ matrix.target }}/release/ma-demo version)"
          echo "stamped=$got want=$want"
          [ "$got" = "$want" ] || { echo "::error::version mismatch: $got != $want"; exit 1; }

      - name: Package
        id: pkg
        shell: bash
        run: |
          bin="ma-demo-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/ma-demo" "$bin"
          tarball="ma-demo-${{ needs.resolve.outputs.stripped }}-${{ matrix.target }}.tar.gz"
          tar -czf "$tarball" "$bin"
          shasum -a 256 "$tarball" > "$tarball.sha256" || sha256sum "$tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Stage platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ma-demo-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.tarball }}.sha256

  verify:
    name: verify complete release
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Collect platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ma-demo-*
          merge-multiple: true
          path: release-assets
      - name: Validate release assets
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.stripped }}
        run: |
          cp install.sh release-assets/install.sh
          python3 scripts/verify_release.py release-assets "$RELEASE_VERSION"
      - name: Stage verified release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: publish verified release
    if: github.event_name != 'pull_request'
    needs: [resolve, verify]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - name: Download verified release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release-assets
      - name: Upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.stripped }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          # Include drafts in the authenticated, paginated check. Lookup errors
          # stop publication; no existing release or asset is ever overwritten.
          existing="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ -z "$existing" ]] || { echo "::error::release already exists"; exit 1; }
          current="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$current" == "$RELEASE_COMMIT" ]] || { echo "::error::release tag moved"; exit 1; }
          release_id="$(gh api --method POST "repos/$GH_REPO/releases" \
            -f tag_name="$RELEASE_TAG" -f name="$RELEASE_TAG" \
            -f body="$(cat "docs/releases/${RELEASE_VERSION}.md")" \
            -F draft=true -F prerelease=false --jq .id)"
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "::error::invalid release ID"; exit 1; }
          for asset in release-assets/*; do
            gh api --method POST \
              "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=${asset##*/}" \
              --header 'Content-Type: application/octet-stream' \
              --input "$asset" > /dev/null
          done
          current="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$current" == "$RELEASE_COMMIT" ]] || { echo "::error::release tag moved"; exit 1; }
          # Use the new draft's exact ID, so tag lookup cannot select a different
          # draft. A failed upload leaves this release unpublished for inspection.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=true > /dev/null
